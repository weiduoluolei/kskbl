name: Render Video
run-name: Render Video 🎬
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Chinese font
        run: |
          sudo apt update
          sudo apt install -y fonts-noto-cjk
          fc-cache -fv

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npx remotion render src/Root.jsx out/video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: out/video.mp4