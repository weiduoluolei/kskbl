name: Render Video
on:
  workflow_dispatch:
jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Chinese font
        run: |
          sudo apt update
          sudo apt install -y fonts-noto-cjk
          fc-cache -fv